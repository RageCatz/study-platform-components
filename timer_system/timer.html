<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow Timer</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --line: #dce4f4;
            --text: #1f2a44;
            --muted: #6c7898;
            --primary: #6f80ff;
            --primary-soft: #eef1ff;
            --shadow: 0 10px 28px rgba(41,63,115,.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer-card {
            background: var(--panel);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 32px;
        }

        p.subtitle {
            color: var(--muted);
            margin-bottom: 20px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 12px;
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .ring {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 30px auto;
        }

        .ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring circle {
            transition: stroke-dashoffset 1s linear;
        }

        .bg-ring {
            stroke: #eef2fb;
            stroke-width: 12;
            fill: none;
        }

        .progress-ring {
            stroke: var(--primary);
            stroke-width: 12;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 628;
            stroke-dashoffset: 0;
        }

        .time-display {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .time-number {
            font-size: 64px;
            font-weight: 900;
            line-height: 1;
        }

        .time-text {
            font-size: 18px;
            font-weight: 800;
            color: var(--muted);
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7a88ff, #6d79f4);
            color: #fff;
            box-shadow: 0 8px 18px rgba(111,128,255,.22);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--line);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #dde2f5;
        }

        @media (max-width: 500px) {
            .timer-card { margin: 20px; padding: 30px 20px; }
            .ring { width: 200px; height: 200px; }
            .time-number { font-size: 48px; }
        }
    </style>
</head>
<body>

<div class="timer-card">
    <h2>Focus Session</h2>
    <p class="subtitle">Stay focused for 25 minutes.</p>

    <div class="pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="16" rx="2"></rect><path d="M9 9h6M9 13h6M9 17h4"></path></svg>
        <span id="taskName">Math Homework</span>
    </div>

    <div class="ring">
        <svg viewBox="0 0 240 240">
            <circle class="bg-ring" cx="120" cy="120" r="100"></circle>
            <circle class="progress-ring" id="progressRing" cx="120" cy="120" r="100"></circle>
        </svg>
        <div class="time-display">
            <div class="time-number" id="timeDisplay">25:00</div>
            <div class="time-text">Focus Time</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-primary" id="startBtn" onclick="startTimer()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
            Start
        </button>
        <button class="btn-secondary" id="stopBtn" onclick="stopTimer()" style="display:none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zm6 0h4v14h-4z"></path></svg>
            Pause
        </button>
        <button class="btn-secondary" onclick="resetTimer()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3v6h6"></path></svg>
            Reset
        </button>
    </div>
</div>

<script>
    // --- Configuration ---
    const FOCUS_TIME = 25 * 60; // 25 minutes in seconds
    const STORAGE_KEY = 'focus_timer_state';

    // --- State ---
    let timerInterval = null;

    // Load or Init State
    function getState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : {
            remaining: FOCUS_TIME,
            isRunning: false,
            taskName: 'Math Homework'
        };
    }

    function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // --- Logic ---
    function updateUI(state) {
        // Update Text
        const mins = Math.floor(state.remaining / 60);
        const secs = state.remaining % 60;
        document.getElementById('timeDisplay').textContent = 
            `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

            // Update Task
        if(state.taskName) document.getElementById('taskName').textContent = state.taskName;

        // Update Ring
        const total = FOCUS_TIME;
        const pct = (total - state.remaining) / total;
        const circumference = 2 * Math.PI * 100; // r=100
        const offset = circumference * pct;
        document.getElementById('progressRing').style.strokeDashoffset = offset;

        // Toggle Buttons
        document.getElementById('startBtn').style.display = state.isRunning ? 'none' : 'inline-flex';
        document.getElementById('stopBtn').style.display = state.isRunning ? 'inline-flex' : 'none';
    }

    function tick() {
        let state = getState();
        if (state.remaining > 0) {
            state.remaining--;
            saveState(state);
            updateUI(state);
        } else {
            stopTimer();
            alert("Focus session complete!");
            playAlert();
        }
    }

    function startTimer() {
        let state = getState();
        if (state.isRunning) return;

        state.isRunning = true;
        saveState(state);
        updateUI(state);

        timerInterval = setInterval(tick, 1000);

        // Unlock Audio
        document.body.click();
    }

    function stopTimer() {
        clearInterval(timerInterval);
        let state = getState();
        state.isRunning = false;
        saveState(state);
        updateUI(state);
    }

    function resetTimer() {
        stopTimer();
        let state = getState();
        state.remaining = FOCUS_TIME;
        saveState(state);
        updateUI(state);
    }

    function playAlert() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 880; // High beep
            gain.gain.value = 0.1;
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
            if(navigator.vibrate) navigator.vibrate([200,100,200]);
        } catch(e) {}
    }

    // --- Init ---
    const initialState = getState();
    updateUI(initialState);

    // Auto-resume if it was running
    if (initialState.isRunning) {
        startTimer();
    }

</script>
</body>
</html>

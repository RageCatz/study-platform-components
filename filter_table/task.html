<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        :root {
            --bg: #f9f9f9;
            --text: #333;
            --border: #ddd;
            --primary: #6f80ff;
            --primary-soft: #eef1ff;
        }

        body {
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 30px;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            max-width: 900px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #f4f4f4;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        select {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .primary-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .primary-btn:hover {
            opacity: 0.9;
        }

        .table-container {
            margin-top: 20px;
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }

        .table th {
            text-align: left;
            padding: 10px;
            border-bottom: 2px solid var(--border);
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
        }

        .table td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .table tr:hover {
            background: #fafafa;
        }

        .priority {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: capitalize;
        }

        .priority.high {
          background: #ffe9e9;
          color: #c00;
        }

        .priority.medium {
          background: #fff3df;
          color: #c78a2f;
        }

        .priority.low {
          background: #e9f8f0;
          color: #2a7a4d;
        }

        .status-pill {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .status-pill.todo {
          background: #eef2ff;
          color: #4b5ce0;
        }

        .status-pill.done {
          background: #e9f8f0;
          color: #2a7a4d;
          opacity: 0.7;
        }

        .status-pill.done:hover {
          opacity: 1;
        }

        .action-btn {
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 4px;
            margin-right: 4px;
        }

        .action-btn.danger {
          color: #c00;
          border-color: #fadbd8;
          background: #fdf2f2;
        }

        .action-btn.edit {
          color: var(--primary);
          border-color: #d0d8ff;
          background: #f4f7ff;
        }

        .action-btn:hover {
          background: #f0f0f0;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.open {
          display: flex;
        }

        .modal {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal h3 {
          margin-top: 0;
        }

        .form-group {
          margin-bottom: 15px;
        }

        .form-group label {
          display: block;
          margin-bottom: 5px;
          font-weight: bold;
          font-size: 13px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-family: inherit;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .secondary-btn {
            background: #f4f4f4;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
  <div class="toolbar">
    <h3 style="margin:0;">My Tasks</h3>
    <button class="primary-btn" onclick="openModal()">+ Add Task</button>
  </div>

  <p class="muted" style="margin-top:-10px; margin-bottom: 20px; color:#888;">Manage and filter your todo list.</p>

  <!-- Filter Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="setFilter('all', this)">All</button>
    <button class="tab" onclick="setFilter('today', this)">Today</button>
    <button class="tab" onclick="setFilter('upcoming', this)">Upcoming</button>
    <button class="tab" onclick="setFilter('completed', this)">Completed</button>
  </div>

  <!-- Sorting Toolbar -->
  <div class="toolbar">
    <div>
        <strong>Task List</strong>
    </div>
    <select id="sortSelect" onchange="renderTasks()">
      <option value="due-asc">Due Date (Earliest)</option>
      <option value="due-desc">Due Date (Latest)</option>
      <option value="priority-high">Priority (High to Low)</option>
    </select>
  </div>

  <!-- The Data Table -->
  <div class="table-container">
    <table class="table">
      <thead>
        <tr>
          <th>Task Name</th>
          <th>Due Date</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="taskTableBody">
        <!-- Rows injected by JS -->
      </tbody>
    </table>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <h3 id="modalTitle">Add New Task</h3>
    <input type="hidden" id="taskId">

    <div class="form-group">
      <label>Task Name</label>
      <input type="text" id="taskName" placeholder="e.g. Math Homework">
    </div>

    <div class="form-group">
      <label>Due Date</label>
      <input type="date" id="taskDate">
    </div>

    <div class="form-group">
      <label>Priority</label>
      <select id="taskPriority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="secondary-btn" onclick="closeModal()">Cancel</button>
      <button class="primary-btn" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<script>
    // 1. Default Data (used if LocalStorage is empty)
    const defaultTasks = [
        {id: 1, name: 'Math Homework', dueDate: '2023-10-25', status: 'todo', priority: 'high'},
        {id: 2, name: 'Science Revision', dueDate: '2023-10-26', status: 'todo', priority: 'medium'},
        {id: 3, name: 'English Essay', dueDate: '2023-10-27', status: 'todo', priority: 'low'},
        {id: 4, name: 'History Notes', dueDate: '2023-10-20', status: 'done', priority: 'medium'}
    ];

    // 2. State
    let appData = { tasks: [] };
    let currentFilter = 'all';
    let sortOrder = 'due-asc';

    // === LOCAL STORAGE FUNCTIONS ===

    function loadData() {
        const saved = localStorage.getItem('my_tasks_data');
        if (saved) {
            appData = JSON.parse(saved);
        } else {
            // Clone default data to avoid mutating the constant
            appData = { tasks: JSON.parse(JSON.stringify(defaultTasks)) };
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem('my_tasks_data', JSON.stringify(appData));
    }

    // === HELPER FUNCTIONS ===

    function todayISO() {
        const d = new Date();
        return d.toISOString().slice(0, 10);
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.toString()
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDateLabel(isoDate) {
        if(!isoDate) return '';
        const d = new Date(isoDate + 'T00:00:00');
        const today = new Date(todayISO() + 'T00:00:00');
        const tomorrow = new Date(new Date(today).setDate(today.getDate() + 1));

        if (d.getTime() === today.getTime()) return 'Today';
        if (d.getTime() === tomorrow.getTime()) return 'Tomorrow';
        return d.toLocaleDateString({ weekday: 'short', day: 'numeric', month: 'short' });
    }

    function getPriorityValue(p) {
        return p === 'high' ? 3 : p === 'medium' ? 2 : 1;
    }

    // === FILTERING & SORTING ===

    function getFilteredTasks() {
        return appData.tasks.filter(task => {
            const today = todayISO();
            if (currentFilter === 'all') return true;
            if (currentFilter === 'today') return task.dueDate === today;
            if (currentFilter === 'upcoming') return task.status !== 'done' && task.dueDate > today;
            if (currentFilter === 'completed') return task.status === 'done';
            return true;
        });
    }

    function getSortedTasks(filtered) {
        return [...filtered].sort((a, b) => {
            if (sortOrder === 'due-asc') return a.dueDate.localeCompare(b.dueDate);
            if (sortOrder === 'due-desc') return b.dueDate.localeCompare(a.dueDate);
            if (sortOrder === 'priority-high') return getPriorityValue(b.priority) - getPriorityValue(a.priority);
            return 0;
        });
    }

    // === RENDER ===

    function renderTasks() {
        const tbody = document.getElementById('taskTableBody');
        const filtered = getFilteredTasks();
        const sorted = getSortedTasks(filtered);

        if (sorted.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">No tasks found.</td></tr>';
            return;
        }

        tbody.innerHTML = sorted.map(task => `
            <tr>
                <td><strong>${escapeHtml(task.name)}</strong></td>
                <td>${formatDateLabel(task.dueDate)}</td>
                <td><span class="priority ${task.priority}">${task.priority}</span></td>
                <td>
                    <button class="status-pill ${task.status}" onclick="toggleStatus(${task.id})">
                        ${task.status === 'done' ? 'Done' : 'To Do'}
                    </button>
                </td>
                <td>
                    <button class="action-btn edit" onclick="openModal(${task.id})">Edit</button>
                    <button class="action-btn danger" onclick="deleteTask(${task.id})">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    // === ACTIONS ===

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        renderTasks();
    }

    function toggleStatus(id) {
        const task = appData.tasks.find(t => t.id === id);
        if (task) {
            task.status = task.status === 'done' ? 'todo' : 'done';
            saveData(); // Auto-save
            renderTasks();
        }
    }

    function deleteTask(id) {
        if (confirm('Are you sure you want to delete this task?')) {
            appData.tasks = appData.tasks.filter(t => t.id !== id);
            saveData(); // Auto-save
            renderTasks();
        }
    }

    // === MODAL ===

    function openModal(id = null) {
        const modal = document.getElementById('taskModal');
        const title = document.getElementById('modalTitle');
        const idField = document.getElementById('taskId');

        if (id) {
            const task = appData.tasks.find(t => t.id === id);
            title.innerText = 'Edit Task';
            idField.value = task.id;
            document.getElementById('taskName').value = task.name;
            document.getElementById('taskDate').value = task.dueDate;
            document.getElementById('taskPriority').value = task.priority;
        } else {
            title.innerText = 'Add New Task';
            idField.value = '';
            document.getElementById('taskName').value = '';
            document.getElementById('taskDate').value = '';
            document.getElementById('taskPriority').value = 'medium';
        }

        modal.classList.add('open');
    }

    function closeModal() {
        document.getElementById('taskModal').classList.remove('open');
    }

    function saveTask() {
        const id = document.getElementById('taskId').value;
        const name = document.getElementById('taskName').value.trim();
        const date = document.getElementById('taskDate').value;
        const priority = document.getElementById('taskPriority').value;

        if (!name || !date) {
            alert('Please fill in task name and due date');
            return;
        }

        if (id) {
            // Update existing
            const task = appData.tasks.find(t => t.id == id);
            if (task) {
                task.name = name;
                task.dueDate = date;
                task.priority = priority;
            }
        } else {
            // Create new
            const newId = appData.tasks.length > 0 ? Math.max(...appData.tasks.map(t => t.id)) + 1 : 1;
            appData.tasks.push({
                id: newId,
                name: name,
                dueDate: date,
                priority: priority,
                status: 'todo'
            });
        }

        saveData(); // Auto-save
        closeModal();
        renderTasks();
    }

    // === SETUP ===

    // Initialize
    document.getElementById('sortSelect').addEventListener('change', (e) => {
        sortOrder = e.target.value;
        renderTasks();
    });

    // Load data from LocalStorage first
    loadData();
    renderTasks();
</script>
</body>
</html>

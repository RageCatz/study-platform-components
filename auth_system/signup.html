<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>

  <style>
    body {
      font-family: Arial;
      background: #f6f8fb;
      display: grid;
      place-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 340px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4f63d7;
      color: white;
      border: 0;
      cursor: pointer;
      margin-top: 10px;
    }

    .msg { margin-top: 10px; }
  </style>
</head>

<body>
<div class="card">
  <h2>Sign Up</h2>

  <input id="name" placeholder="full name">
  <input id="username" placeholder="username">
  <input id="password" type="password" placeholder="password">

  <button onclick="signup()">Create Account</button>

  <p class="msg" id="msg"></p>

  <p><a href="login.html">Go to Login</a></p>
</div>

<script>
function slug(v) {
  return v.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_");
}

function signup() {
  const name = document.getElementById("name").value.trim();
  const username = slug(document.getElementById("username").value);
  const password = document.getElementById("password").value;

  if (!name || !username || !password) {
    document.getElementById("msg").textContent = "Fill all fields";
    return;
  }

  // TEMP SAVE
  localStorage.setItem("user", JSON.stringify({
    name,
    username
  }));

  document.getElementById("msg").textContent = "Account created!";

  setTimeout(() => {
    window.location.href = "index.html";
  }, 500);
}
</script>
</body>
</html>

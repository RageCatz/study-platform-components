<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    body {
      font-family: Arial;
      background: #f6f8fb;
      display: grid;
      place-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 320px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4f63d7;
      color: white;
      border: 0;
      cursor: pointer;
    }

    .msg { margin-top: 10px; font-size: 14px; }
  </style>
</head>

<body>
<div class="card">
  <h2>Login</h2>

  <input id="username" placeholder="username">
  <input id="password" type="password" placeholder="password">

  <button onclick="login()">Login</button>

  <p class="msg" id="msg"></p>

  <p><a href="signup.html">Go to Signup</a></p>
</div>

<script>
function slug(v) {
  return v.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_");
}

function login() {
  const username = slug(document.getElementById("username").value);
  const password = document.getElementById("password").value;

  if (!username || !password) {
    document.getElementById("msg").textContent = "Fill all fields";
    return;
  }

  // TEMP LOGIN (no backend yet)
  localStorage.setItem("user", JSON.stringify({
    name: username,
    username
  }));

  document.getElementById("msg").textContent = "Logged in!";

  setTimeout(() => {
    window.location.href = "index.html";
  }, 500);
}
</script>
</body>
</html>

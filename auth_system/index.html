<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #fff;
      --text: #1f2a44;
      --muted: #64708d;
      --line: #dce4f4;
      --primary: #4f63d7;
      --success: #2f8e5d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    main { width: min(900px, 100%); margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .tasks { list-style: none; padding: 0; display: grid; gap: 10px; }

    .task {
      border: 1px solid var(--line);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
    }

    .pill { color: var(--success); font-weight: 700; }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
<main>
  <header>
    <div>
      <h1>Welcome</h1>
      <p id="welcome">Loading...</p>
    </div>

    <button id="logout">Log Out</button>
  </header>

  <section class="panel">
    <h2>Your Tasks</h2>
    <ul id="tasks" class="tasks"></ul>
  </section>

  <section class="panel">
    <h2>Progress</h2>
    <p id="progress"></p>
  </section>
</main>

<script>
  const user = JSON.parse(localStorage.getItem("user"));

  if (!user) {
    window.location.href = "login.html";
  }

  document.getElementById("welcome").textContent =
    `Welcome, ${user.name} (@${user.username})`;

  const data = {
    tasks: [
      { name: "Study Math", status: "doing", priority: "high", dueDate: "today" }
    ],
    progress: {
      focusMinutesToday: 25,
      totalSessions: 2
    }
  };

  document.getElementById("tasks").innerHTML =
    data.tasks.map(t => `
      <li class="task">
        <span>${t.name}</span>
        <span class="pill">${t.status} - ${t.priority}</span>
      </li>
    `).join("");

  document.getElementById("progress").textContent =
    `${data.progress.focusMinutesToday} minutes today, ${data.progress.totalSessions} sessions`;

  document.getElementById("logout").addEventListener("click", () => {
    localStorage.removeItem("user");
    window.location.href = "login.html";
  });
</script>
</body>
</html>

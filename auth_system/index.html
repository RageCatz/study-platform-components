<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #fff;
      --text: #1f2a44;
      --muted: #64708d;
      --line: #dce4f4;
      --primary: #4f63d7;
      --primary-dark: #3f50ad;
      --accent: #eef7f1;
      --danger: #c14e4e;
      --success: #2f8e5d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(820px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(41, 63, 115, .1);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
    }

    .intro {
      background: var(--accent);
      padding: 32px;
    }

    .form { padding: 32px; }

    h1, h2 { margin: 0 0 12px; }

    p, .hint { color: var(--muted); line-height: 1.5; }

    form {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #c9d5f1;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid #dfe7ff;
      border-color: var(--primary);
    }

    .field.invalid input { border-color: #ff9f43; }

    .error {
      display: none;
      color: var(--danger);
      font-size: 13px;
      margin-top: 5px;
      font-weight: 700;
    }

    .field.invalid .error { display: block; }

    .options { display: grid; gap: 10px; }

    .checkline {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 700;
    }

    .checkline input { width: auto; }

    button, .signup-link {
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .primary { background: var(--primary); color: #fff; }
    .primary:hover { background: var(--primary-dark); }

    .secondary {
      background: #f3f6ff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
    }

    .message.show { display: block; }
    .message.good { background: #e9f8f0; color: var(--success); }
    .message.bad { background: #ffe9e9; color: var(--danger); }

    .signup-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 720px) {
      .card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="intro">
      <h1>Login</h1>
      <p>Log in to continue with your saved tasks, focus settings, progress, and profile.</p>
    </section>

    <section class="form">
      <h2>Log in</h2>
      <p>Welcome back. Pick up where you left off.</p>

      <form id="loginForm" novalidate>
        <div class="field" id="usernameField">
          <label for="username">Username</label>
          <input id="username" autocomplete="username" placeholder="Enter your username">
          <div class="error"></div>
        </div>

        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password">
          <div class="error"></div>
        </div>

        <div class="options">
          <label class="checkline">
            <input id="showPassword" type="checkbox">
            Show password
          </label>
          <label class="checkline">
            <input id="rememberLogin" type="checkbox">
            Keep me logged in on this browser
          </label>
        </div>

        <button class="primary" type="submit">Log In</button>
        <div id="message" class="message" role="alert"></div>
      </form>

      <div class="signup-box">
        <strong>New here?</strong>
        <p><a class="signup-link secondary" href="signup.html">Go to Sign Up</a></p>
      </div>
    </section>
  </main>

  <script>
    // API Base URL
    const API_BASE = 'https://study-platform-p3q7.onrender.com';

    const $ = (id) => document.getElementById(id);

    const form = $('loginForm');
    const usernameInput = $('username');
    const passwordInput = $('password');
    const showPasswordInput = $('showPassword');
    const rememberLoginInput = $('rememberLogin');
    const message = $('message');

    function slug(value) {
      return String(value).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    }

    function setFieldError(fieldId, text = '') {
      const field = $(fieldId);
      field.classList.toggle('invalid', Boolean(text));
      field.querySelector('.error').textContent = text;
    }

    function setMessage(text = '', type = '') {
      message.textContent = text;
      message.className = text ? `message show ${type}` : 'message';
    }

    function clearErrors() {
      setFieldError('usernameField');
      setFieldError('passwordField');
      setMessage();
    }

    function validateForm() {
      clearErrors();
      let valid = true;

      if (!usernameInput.value.trim()) {
        setFieldError('usernameField', 'Please enter your username.');
        valid = false;
      }

      if (!passwordInput.value) {
        setFieldError('passwordField', 'Please enter your password.');
        valid = false;
      } else if (passwordInput.value.length < 6) {
        setFieldError('passwordField', 'Your password must be at least 6 characters.');
        valid = false;
      }

      return valid;
    }

    // REMOVED: checkExistingSession() - This was auto-redirecting to dashboard

    async function login() {
      setMessage('Checking your login...', 'good');

      try {
        const response = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: slug(usernameInput.value),
            password: passwordInput.value,
            remember: rememberLoginInput.checked
          })
        });
        
        const result = await response.json();

        if (!response.ok) {
          setMessage(result.message || 'Incorrect username or password.', 'bad');
          return;
        }

        setMessage('Login successful. Redirecting...', 'good');
        setTimeout(() => {
          location.href = result.redirect || 'dashboard.html';
        }, 500);
      } catch (err) {
        console.error('Login error:', err);
        setMessage('Could not connect to the server.', 'bad');
      }
    }

    usernameInput.addEventListener('input', clearErrors);
    passwordInput.addEventListener('input', clearErrors);

    showPasswordInput.addEventListener('change', () => {
      passwordInput.type = showPasswordInput.checked ? 'text' : 'password';
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      usernameInput.value = slug(usernameInput.value);
      if (validateForm()) login();
    });
  </script>
</body>
</html>

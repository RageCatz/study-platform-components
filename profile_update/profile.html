<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Changes</title>
    <style>
        /* --- 1. Core Variables --- */
        :root {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --line: #dce4f4;
            --text: #1f2a44;
            --muted: #6c7898;
            --primary: #6f80ff;
            --shadow: 0 10px 28px rgba(41,63,115,.08);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- 2. Card Layout --- */
        .card {
            background: var(--panel);
            border-radius: 22px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
        }

        h3 {
            margin: 0 0 20px;
            font-size: 22px;
        }

        .muted {
            color: var(--muted);
        }

        /* --- 3. Form Fields --- */
        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--panel);
            font-size: 16px;
            color: var(--text);
        }

        .field input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* --- 4. Buttons --- */
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .primary-btn {
            background: linear-gradient(135deg, #7a88ff, #6d79f4);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 14px 18px;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 10px 18px rgba(111,128,255,.24);
        }

        .primary-btn:hover {
            opacity: 0.9;
        }

        /* --- 5. Toast --- */
        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: #1f2a44;
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 999;
        }

        .toast.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Profile</h3>

        <!-- Editable Form Fields -->
        <div class="field">
            <label>Full Name</label>
            <input type="text" id="nameInput" placeholder="Enter your name">
        </div>

        <div class="field">
            <label>Industry</label>
            <input type="text" id="industryInput" placeholder="Enter your industry">
        </div>

        <div class="field">
            <label>Country</label>
            <input type="text" id="countryInput" placeholder="Enter your country">
        </div>

        <div class="field">
            <label>Year Level</label>
            <input type="text" id="yearInput" placeholder="Enter your year level">
        </div>

        <div class="btn-row">
            <button class="primary-btn" id="saveBtn">Save Changes</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Changes saved successfully!</div>

    <script>
        // --- 1. Default User Data ---
        const defaultUser = {
            name: "Student",
            industry: "High School Student",
            country: "New Zealand",
            year: "Year 11",
            lastSaved: null,
            saveCount: 0
        };

        // --- 2. Data Helpers ---
        function loadData() {
            const raw = localStorage.getItem('ff_demo_user');
            return raw ? JSON.parse(raw) : { ...defaultUser };
        }

        function saveData(data) {
            data.lastSaved = new Date().toISOString();
            data.saveCount = (data.saveCount || 0) + 1;
            localStorage.setItem('ff_demo_user', JSON.stringify(data));
        }

        // --- 3. Toast Helper ---
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                t.classList.remove('show');
            }, 2200);
        }

        // --- 4. Populate Form with Saved Data ---
        function populateForm() {
            const data = loadData();
            document.getElementById('nameInput').value = data.name || '';
            document.getElementById('industryInput').value = data.industry || '';
            document.getElementById('countryInput').value = data.country || '';
            document.getElementById('yearInput').value = data.year || '';
        }

        // --- 5. Main Save Function ---
        document.getElementById('saveBtn').addEventListener('click', () => {
            // Get values from input fields
            const name = document.getElementById('nameInput').value.trim();
            const industry = document.getElementById('industryInput').value.trim();
            const country = document.getElementById('countryInput').value.trim();
            const year = document.getElementById('yearInput').value.trim();

            // Build data object
            const data = {
                name: name || defaultUser.name,
                industry: industry || defaultUser.industry,
                country: country || defaultUser.country,
                year: year || defaultUser.year
            };

            // Get existing save count
            const existing = loadData();
            data.lastSaved = new Date().toISOString();
            data.saveCount = (existing.saveCount || 0) + 1;

            // Save to localStorage
            saveData(data);

            // Show success toast
            showToast('Settings saved');
        });

        // --- 6. Initialize ---
        populateForm();
    </script>
</body>
</html>
